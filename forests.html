<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Gallery</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Forests Gallery</h1>

    <div class="gallery">
        <img src="forest1.jpg" alt="Forest Image 1">
        <img src="forest2.jpg" alt="Forest Image 2">
        <img src="forest3.jpg" alt="Forest Image 3">
        <img src="forest4.jpg" alt="Forest Image 4">
        <img src="forest5.jpg" alt="Forest Image 5">
        <img src="forest6.jpg" alt="Forest Image 6">
    </div>

</body>
</html>
