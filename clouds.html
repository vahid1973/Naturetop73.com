<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clouds Gallery</title>
    <style>
        body {
            background-color: #e0f7fa;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
        }
        img {
            width: 70%;
            border-radius: 8px;
            margin-top: 15px;
        }
        h1 {
            color: #03a9f4;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Clouds Gallery</h1>
        <p>Beautiful views of the sky and clouds:</p>

        <img src="images/cloud1.jpg" alt="Clouds 1">
        <img src="images/cloud2.jpg" alt="Clouds 2">
        <img src="images/cloud3.jpg" alt="Clouds 3">
    </div>

</body>
          </html>
