<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        a.back {
            display: inline-block;
            margin: 20px;
            padding: 12px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        a.back:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Flowers Gallery</h1>

    <div class="gallery">
        <img src="images/flower1.jpg" alt="Flowers Image 1">
        <img src="images/flower2.jpg" alt="Flowers Image 2">
        <img src="images/flower3.jpg" alt="Flowers Image 3">
        <img src="images/flower4.jpg" alt="Flowers Image 4">
        <img src="images/flower5.jpg" alt="Flowers Image 5">
        <img src="images/flower6.jpg" alt="Flowers Image 6">
    </div>

    <a class="back" href="index.html">Back to Home</a>

</body>
</html>
