<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waterfalls Gallery</title>
    <style>
        body {
            background-color: #e0f7fa;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #81d4fa;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
        }
        h1 {
            color: #0288d1;
        }
        p {
            color: #555555;
        }
        img {
            width: 70%;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Waterfalls Gallery</h1>
        <p>Enjoy beautiful waterfall views:</p>

        <img src="images/waterfall1.jpg" alt="Waterfall 1">
        <img src="images/waterfall2.jpg" alt="Waterfall 2">
        <img src="images/waterfall3.jpg" alt="Waterfall 3">
    </div>

</body>
</html>
