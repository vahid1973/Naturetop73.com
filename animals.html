<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animals</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
        }
        img {
            width: 70%;
            border-radius: 8px;
            margin-top: 15px;
        }
        h1 {
            font-size: 28px;
            color: #333;
        }
        p {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Animal Gallery</h1>
        <p>Here are some amazing animals:</p>

        <img src="images/animal1.jpg" alt="Animal 1">
        <img src="images/animal2.jpg" alt="Animal 2">
        <img src="images/animal3.jpg" alt="Animal 3">
    </div>

</body>
</html>
