<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sea</title>
    <style>
        body {
            background-color: #e0f7fa;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #add;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
        }
        img {
            width: 70%;
            border-radius: 8px;
            margin-top: 15px;
        }
        h1 {
            color: #0077b6;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Sea</h1>
        <p>Enjoy the peaceful view of the ocean.</p>

        <img src="images/sea1.jpg" alt="Sea 1">
        <img src="images/sea2.jpg" alt="Sea 2">
    </div>

</body>
</html>
