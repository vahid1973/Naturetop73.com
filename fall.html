
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fall</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: #fff;
            color: #000;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            margin: auto;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.4); /* پاییزی‌تر! */
        }
        img {
            width: 90%;
            border-radius: 12px;
            margin-top: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fall Season</h1>
        <p>A gallery of the beautiful autumn scenery.</p>

        <img src="images/fall1.jpg" alt="Fall 1">
        <img src="images/fall2.jpg" alt="Fall 2">
        <img src="images/fall3.jpg" alt="Fall 3">
    </div>

</body>
</html>
