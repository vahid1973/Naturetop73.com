<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunsets</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: #fff;
            color: #000;
            padding: 30px;
            border-radius: 12px;
            width: 80%;
            margin: auto;
            box-shadow: 0 0 20px rgba(255, 150, 50, 0.4);
        }
        img {
            width: 90%;
            border-radius: 12px;
            margin-top: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sunsets</h1>
        <p>Beautiful sunset gallery.</p>

        <img src="images/sunset1.jpg" alt="Sunset 1">
        <img src="images/sunset2.jpg" alt="Sunset 2">
        <img src="images/sunset3.jpg" alt="Sunset 3">
    </div>

</body>
</html>
