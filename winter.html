<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Winter Gallery</title>
    <style>
        body {
            background-color: #e3f2fd;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #90caf9;
            border-radius: 8px;
            padding: 20px;
            width: 80%;
            margin: 20px auto;
        }
        h1 {
            color: #1565c0;
        }
        p {
            color: #555555;
        }
        img {
            width: 70%;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Winter Gallery</h1>
        <p>Explore beautiful winter landscapes:</p>

        <img src="images/winter1.jpg" alt="Winter 1">
        <img src="images/winter2.jpg" alt="Winter 2">
        <img src="images/winter3.jpg" alt="Winter 3">
    </div>

</body>
</html>
